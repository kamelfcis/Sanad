name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    env:
      # Placeholder public values so `next build` succeeds without real secrets.
      # Runtime uses the real values from the deployment environment.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (critical specs)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Disable app-level throttling so rapid test traffic is not rate limited.
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Check E2E secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E skipped — Supabase secrets not configured in repo settings."
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.secrets.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.secrets.outputs.configured == 'true'
        run: npm run build

      - name: Seed E2E users
        if: steps.secrets.outputs.configured == 'true'
        run: npm run seed:e2e

      - name: Run critical E2E specs
        if: steps.secrets.outputs.configured == 'true'
        run: >
          npx playwright test
          e2e/technician-admin-workflow.spec.ts
          e2e/full-workflow.spec.ts
          e2e/workflow-chat-realtime.spec.ts
          e2e/admin-technician-review.spec.ts
          e2e/admin-i18n.spec.ts
          --reporter=list

      - name: Upload Playwright report
        if: ${{ always() && steps.secrets.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results.json
            e2e/playwright-output
          retention-days: 7
